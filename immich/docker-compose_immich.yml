version: '3.8'

services:
  # PostgreSQL Database for Immich
  immich-db:
    image: postgres:15-alpine
    container_name: immich-db
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${DB_PASSWORD:-immich_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - immich-db-data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immich-network

  # Redis Cache
  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immich-network

  # Immich Server (API)
  immich-server:
    image: ghcr.io/immich-app/immich-server:latest
    container_name: immich-server
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${DB_PASSWORD:-immich_password}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      LOG_LEVEL: log
      NODE_ENV: production
      # Optional: Add Immich-specific variables
      IMMICH_SKIP_MIGRATION: "false"
      # Optional: Machine learning settings
      # MACHINE_LEARNING_ENABLED: "true"
    volumes:
      - immich-upload:/usr/src/app/upload
      - immich-thumbs:/usr/src/app/thumbs
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${IMMICH_PORT:-3001}:3001"
    restart: unless-stopped
    networks:
      - immich-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/server/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Immich Microservices (Machine Learning, etc.)
  immich-microservices:
    image: ghcr.io/immich-app/immich-server:latest
    container_name: immich-microservices
    command: start.sh microservices
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${DB_PASSWORD:-immich_password}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      LOG_LEVEL: log
      NODE_ENV: production
      IMMICH_SKIP_MIGRATION: "false"
      # Optional: Machine learning settings
      # MACHINE_LEARNING_ENABLED: "true"
    volumes:
      - immich-upload:/usr/src/app/upload
      - immich-thumbs:/usr/src/app/thumbs
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      - immich-network

  # Immich Web Frontend
  immich-web:
    image: ghcr.io/immich-app/immich-web:latest
    container_name: immich-web
    depends_on:
      - immich-server
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3001}
    ports:
      - "${IMMICH_WEB_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - immich-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Machine Learning Service (uncomment if needed)
  # immich-machine-learning:
  #   image: ghcr.io/immich-app/immich-machine-learning:latest
  #   container_name: immich-machine-learning
  #   depends_on:
  #     - immich-server
  #   environment:
  #     MACHINE_LEARNING_URL: http://immich-machine-learning:3003
  #   volumes:
  #     - immich-ml-cache:/cache
  #   ports:
  #     - "3003:3003"
  #   restart: unless-stopped
  #   networks:
  #     - immich-network

volumes:
  immich-db-data:
    driver: local
  immich-upload:
    driver: local
  immich-thumbs:
    driver: local
  # immich-ml-cache:
  #   driver: local

networks:
  immich-network:
    driver: bridge
