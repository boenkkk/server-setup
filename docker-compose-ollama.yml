services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    networks:
      - app-tier
    volumes:
      - /opt/ollama:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull deepseek-coder:1.3b-instruct
        wait

networks:
  app-tier:
    name: app-tier
    driver: bridge
